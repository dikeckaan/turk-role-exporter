name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, feature/cf-worker-full-site]
    paths:
      - 'worker/**'
      - 'docs/**'
      - 'wrangler.toml'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            PROTECTED_PASSWORD
        env:
          PROTECTED_PASSWORD: ${{ secrets.PROTECTED_PASSWORD }}
