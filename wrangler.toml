name = "turk-role-exporter"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[site]
bucket = "."
exclude = ["node_modules", "worker", "docs", ".git", "package.json", "package-lock.json", "wrangler.toml", ".gitignore"]

# Password should be set as a secret in production:
#   wrangler secret put PROTECTED_PASSWORD
# The [vars] below is for local development only.
[vars]
PROTECTED_PASSWORD = "changeme"
